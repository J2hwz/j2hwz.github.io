<!DOCTYPE html>
<html>
<head>
  <title>Birthday Problem Experiment</title>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-slider-response@1.1.3"></script>
  <script src="https://unpkg.com/survey-core@2.0.0/survey.core.min.js"></script>
  <script src="https://unpkg.com/survey-js-ui@2.0.0/survey-js-ui.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/survey-core@2.0.0/defaultV2.min.css">
  <link rel="stylesheet" href="https://unpkg.com/survey-core@2.0.0/themes/flat.min.css">
  <script src="https://unpkg.com/@jspsych/plugin-survey@2.1.0"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css">
</head>
<body>

<script>
  const jsPsych = initJsPsych({
    show_progress_bar: true,
    on_finish: () => jsPsych.data.displayData()
  });
</script>

<script src="js/demographics.js"></script>
<script src="js/ethics.js"></script>
<script src="js/instructions.js"></script>
<script src="js/stimuli.js"></script>
<script src="js/trials_helpers.js"></script>
<script src="js/trials.js"></script>
<script src="js/debrief.js"></script>

<script>
  // Aggregate timeline. Individual pages are defined in separate js scripts in the js folder
  const timeline = [
    ...ethics,
    ...instructions,
    ...trials,
    // ...demographics,
    ...debrief
  ];

  jsPsych.run(timeline);
</script>

</body>
</html>
